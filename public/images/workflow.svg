<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520" role="img" aria-labelledby="t d">
  <title id="t">RAG pipeline workflow</title>
  <desc id="d">Five connected nodes: Drive upload, Embeddings, Pinecone store, AI Agent, and Answer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A2370"/><stop offset="1" stop-color="#1B1740"/>
    </linearGradient>
  </defs>
  <rect width="640" height="520" rx="28" fill="url(#bg)"/>
  <g fill="none" stroke="#12A58A" stroke-width="3" stroke-linecap="round">
    <path d="M120 110 C 120 170, 320 150, 320 200"/>
    <path d="M520 110 C 520 170, 320 150, 320 200" stroke="#8C7DF0"/>
    <path d="M320 270 C 320 320, 320 330, 320 360"/>
    <path d="M320 430 L320 462"/>
  </g>
  <g font-family="Verdana, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">
    <g>
      <rect x="40" y="50" width="160" height="60" rx="14" fill="#F4F3FA"/>
      <circle cx="64" cy="80" r="7" fill="#12A58A"/>
      <text x="130" y="86" fill="#1B1740">Drive upload</text>
    </g>
    <g>
      <rect x="440" y="50" width="160" height="60" rx="14" fill="#F4F3FA"/>
      <circle cx="464" cy="80" r="7" fill="#8C7DF0"/>
      <text x="530" y="86" fill="#1B1740">User question</text>
    </g>
    <g>
      <rect x="220" y="200" width="200" height="70" rx="14" fill="#4B3BC4" stroke="#8C7DF0" stroke-width="2"/>
      <text x="320" y="242" fill="#FFFFFF">Embeddings</text>
    </g>
    <g>
      <rect x="220" y="360" width="200" height="70" rx="14" fill="#12A58A"/>
      <text x="320" y="402" fill="#0B2B25">Pinecone store</text>
    </g>
    <g>
      <rect x="170" y="462" width="300" height="40" rx="20" fill="#F4F3FA"/>
      <text x="320" y="488" fill="#1B1740" font-size="15">AI Agent answers</text>
    </g>
  </g>
